version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_bus_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./school_bus.db
      - JWT_SECRET_KEY=school-bus-secret-key-change-in-production
    volumes:
      - ./backend:/app
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_bus_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
